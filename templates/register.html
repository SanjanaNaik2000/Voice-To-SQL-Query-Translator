<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · DBChatPro 2.0</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="brand">DBChatPro <b>2.0</b></div>
      <div class="sub">Create a new account</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        {% if category == 'error' %}
          <div class="auth-alert">{{ message }}</div>
        {% else %}
          <div class="auth-success">{{ message }}</div>
        {% endif %}
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('register_post') }}">
      <div class="auth-field">
        <label class="auth-label" for="username">Username</label>
        <input class="auth-input" type="text" id="username" name="username"
               placeholder="Choose a username (min 3 chars)" autocomplete="username" required autofocus>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="password">Password</label>
        <input class="auth-input" type="password" id="password" name="password"
               placeholder="Choose a password (min 6 chars)" autocomplete="new-password" required>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="confirm_password">Confirm Password</label>
        <input class="auth-input" type="password" id="confirm_password" name="confirm_password"
               placeholder="Repeat your password" autocomplete="new-password" required>
      </div>

      <button class="auth-btn" type="submit">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login_page') }}">Sign in</a>
    </div>

  </div>
</div>
</body>
</html>
